name: Build and Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify frozen host and runtime
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      runtime: ${{ steps.version.outputs.runtime }}
      runtime_api: ${{ steps.version.outputs.runtime_api }}
      build_host: ${{ steps.version.outputs.build_host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate version boundary
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          runtime=$(node -p 'require("./Runtime/manifest.json").version')
          runtime_api=$(node -p 'require("./Runtime/manifest.json").api')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$runtime" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$runtime_api" =~ ^[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "runtime_api=$runtime_api" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify "refs/tags/v$version" >/dev/null 2>&1; then
            # Host sources MUST NOT silently change under an existing version.
            git diff --exit-code "v$version" HEAD -- Sources Resources Package.swift build.sh
            echo "build_host=false" >> "$GITHUB_OUTPUT"
          else
            echo "build_host=true" >> "$GITHUB_OUTPUT"
          fi
          if git rev-parse --verify "refs/tags/runtime-v$runtime" >/dev/null 2>&1; then
            git diff --exit-code "runtime-v$runtime" HEAD -- Runtime
          fi
      - name: Build new bootstrap host only when explicitly versioned
        if: steps.version.outputs.build_host == 'true'
        run: sh build.sh
      - name: Test runtime against unchanged released host
        if: steps.version.outputs.build_host == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_VERSION: ${{ steps.version.outputs.version }}
          RUNTIME_VERSION: ${{ steps.version.outputs.runtime }}
        run: |
          set -euo pipefail
          node scripts/package-runtime.js dist
          gh release download "v$HOST_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "Yabai-Menu-$HOST_VERSION.zip" --dir dist
          unzip -q "dist/Yabai-Menu-$HOST_VERSION.zip" -d dist/host
          codesign --verify --deep --strict "dist/host/Yabai Menu.app"
          before=$(shasum -a 256 "dist/host/Yabai Menu.app/Contents/MacOS/YabaiMenu")
          "dist/host/Yabai Menu.app/Contents/MacOS/YabaiMenu" --self-test \
            --runtime-file "$PWD/dist/Yabai-Menu-Runtime-$RUNTIME_VERSION.json"
          after=$(shasum -a 256 "dist/host/Yabai Menu.app/Contents/MacOS/YabaiMenu")
          test "$before" = "$after"
          codesign --verify --deep --strict "dist/host/Yabai Menu.app"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: |
            dist/*.zip
            dist/Yabai-Menu-Runtime-*.json
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: release
      - name: Publish separate host and runtime releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_VERSION: ${{ needs.build.outputs.version }}
          RUNTIME_VERSION: ${{ needs.build.outputs.runtime }}
          RUNTIME_API: ${{ needs.build.outputs.runtime_api }}
          BUILD_HOST: ${{ needs.build.outputs.build_host }}
        run: |
          set -euo pipefail
          if [ "$BUILD_HOST" = true ]; then
            # Create immutable host assets. The native updater remains runtime-only.
            gh release create "v$HOST_VERSION" "release/Yabai-Menu-$HOST_VERSION.zip" \
              "release/Yabai-Menu-Runtime-$RUNTIME_VERSION.json" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "$HOST_VERSION · Aplikácia" \
              --notes "Install this host manually once. It never replaces its own app bundle. Runtime updates use separate runtime-v tags. macOS permissions must be granted after this bootstrap; their retention across runtime updates still requires an on-device test."
          fi
          if ! gh release view "runtime-v$RUNTIME_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "runtime-v$RUNTIME_VERSION" "release/Yabai-Menu-Runtime-$RUNTIME_VERSION.json" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "$RUNTIME_VERSION · Runtime" \
              --notes "Runtime-only data/code update requiring Host API $RUNTIME_API. Does not replace or re-sign Yabai Menu.app. See docs/ARCHITECTURE.md and AGENTS.md before contributing."
          fi
          # Normalize display names; tags, published assets and dates stay intact.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.id, .draft, .tag_name, .name] | @tsv' \
            > "$RUNNER_TEMP/yabai-menu-releases.tsv"
          while IFS=$'\t' read -r release_id is_draft release_tag old_title; do
            # Owner-approved cleanup of exactly two abandoned v1.0.0 drafts.
            # Delete by release ID, never by their tag shared with the real release.
            if [[ "$release_id" = 374946008 || "$release_id" = 374946963 ]]; then
              [[ "$is_draft" = true && "$release_tag" = v1.0.0 ]]
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
              continue
            fi
            [[ "$is_draft" = false ]] || continue
            if [[ "$release_tag" =~ ^runtime-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              title="${BASH_REMATCH[1]} · Runtime"
            elif [[ "$release_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              title="${BASH_REMATCH[1]} · Aplikácia"
            else
              continue
            fi
            if [[ "$old_title" != "$title" ]]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                -f name="$title" -f make_latest=false --silent
            fi
          done < "$RUNNER_TEMP/yabai-menu-releases.tsv"
          # Keep GitHub's download recommendation on the installable host,
          # never on a runtime-only JSON release. This only changes metadata.
          gh release edit "v$HOST_VERSION" --repo "$GITHUB_REPOSITORY" --latest
